services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: firstlink:latest
    restart: unless-stopped
    init: true
    env_file:
      - /opt/firstlink/runtime.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /opt/firstlink/data:/app/data
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
